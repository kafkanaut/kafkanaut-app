name: layout-contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.54
          npx playwright install --with-deps chromium
      - name: Layout contract
        run: node tests/layout-contract.mjs
